name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  migration-lab-test:
    name: migration-lab-test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: drawmeanelephant/zig-zouave@2d8510d62b517fa786279562cf8b1bdcf0c47b9f
        with:
          version: 0.17.0
          mirror: https://pkg.machengine.org/zig

      - name: Format check
        run: |
          zig fmt --check build.zig build.zig.zon
          zig fmt --check *.zig

      # The black-box compile tests consume the product `boris` binary as a
      # pinned external prerequisite (see README "Boris pins"): build it from
      # the exact commit the parser-package pin references, so a missing
      # binary is a failure, never a skip. Keep the commit in sync with
      # build.zig.zon.
      - name: Build pinned product Boris (black-box prerequisite)
        run: |
          git clone --quiet https://github.com/drawmeanelephant/boris.git boris-src
          git -C boris-src checkout --quiet 2eb2c915b37ff0eecd7ea0778d6e481a8aea60c7
          zig build --build-file boris-src/build.zig

      - name: Migration-lab aggregate tests
        run: BORIS_BIN="$GITHUB_WORKSPACE/boris-src/zig-out/bin/boris" zig build test

  schema-validation:
    name: schema-validation (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: drawmeanelephant/zig-zouave@2d8510d62b517fa786279562cf8b1bdcf0c47b9f
        with:
          version: 0.17.0
          mirror: https://pkg.machengine.org/zig

      - name: Install locked npm deps
        run: npm --prefix schema-validation ci --ignore-scripts

      - name: Real Draft 2020-12 matrix
        run: zig build schema-test